name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" "platform-tools"

      - name: Set environment variables
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Clean Gradle caches
        run: |
          rm -rf ~/.gradle/caches/transforms
          rm -rf app/build

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-build-cache

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
